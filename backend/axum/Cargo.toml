[package]
name = "nas-mail-client-axum"
version = "0.9.0"
edition = "2021"
autotests = false

[dependencies]
aes-gcm = "0.10.3"
axum = "0.8.9"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
